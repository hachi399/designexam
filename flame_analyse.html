<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高精度 3点角度計測ツール</title>
    <!-- Tailwind CSS (デザイン用) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">

    <div class="max-w-6xl mx-auto p-6">
        <!-- ヘッダー -->
        <header class="mb-8 border-b pb-4">
            <h1 class="text-2xl font-bold text-gray-900">画像3点 角度計測システム</h1>
            <p class="text-sm text-gray-500 mt-1">画像をアップロードし、指示に従って3点（頂点 ➔ 左下 ➔ 右下）をクリックしてください。</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- コントロールパネル (左側) -->
            <div class="lg:col-span-1 space-y-6">
                <!-- ファイル入力 -->
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">① 画像の読み込み</label>
                    <input type="file" id="upload" accept="image/*" 
                        class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                </div>

                <!-- ステータス・ナビゲーション -->
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">② 操作ナビ</label>
                    <div id="status" class="p-3 bg-blue-50 text-blue-800 rounded-lg text-sm font-medium">
                        画像をアップロードしてください。
                    </div>
                </div>

                <!-- 計測結果表示 -->
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">③ 計測結果</label>
                    <div id="result" class="space-y-3">
                        <div class="p-3 bg-gray-50 rounded-lg text-center text-gray-400 text-sm">データ未測定</div>
                    </div>
                    <button id="resetBtn" class="mt-4 w-full bg-red-50 text-red-600 hover:bg-red-100 text-sm font-semibold py-2 px-4 rounded-md transition hidden">
                        選択をリセット
                    </button>
                </div>
            </div>

            <!-- キャンバス表示エリア (右側) -->
            <div class="lg:col-span-3">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 overflow-auto flex justify-center items-center min-h-[500px]">
                    <div class="relative">
                        <canvas id="canvas" class="max-w-full h-auto border border-gray-300 rounded shadow-inner cursor-crosshair hidden"></canvas>
                        <div id="placeholder" class="text-gray-400 flex flex-col items-center justify-center">
                            <svg class="w-16 h-16 mb-2 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 002-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                            <span>ここに画像が表示されます</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const upload = document.getElementById('upload');
        const status = document.getElementById('status');
        const result = document.getElementById('result');
        const resetBtn = document.getElementById('resetBtn');
        const placeholder = document.getElementById('placeholder');

        let points = [];
        let loadedImage = null;

        // ガイドメッセージの定義
        const guides = [
            "1点目（頂点）をクリックしてください",
            "2点目（左下の点）をクリックしてください",
            "3点目（右下の点）をクリックしてください",
            "計測が完了しました！"
        ];

        // 画像アップロード時の処理
        upload.onchange = function(e) {
            if (!e.target.files.length) return;
            
            const img = new Image();
            img.onload = function() {
                loadedImage = img;
                // キャンバスサイズを画像の実サイズに合わせる
                canvas.width = img.width;
                canvas.height = img.height;
                
                // 表示切り替え
                canvas.classList.remove('hidden');
                placeholder.classList.add('hidden');
                resetBtn.classList.remove('hidden');
                
                resetMeasurement();
            }
            // バグ修正: files[0] から取得
            img.src = URL.createObjectURL(e.target.files[0]);
        };

        // 画面の再描画処理（画像 ＋ 点 ＋ 線 ＋ 文字）
        function redraw() {
            if (!loadedImage) return;
            
            // キャンバスをクリアして画像を再描画
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(loadedImage, 0, 0);

            const labels = ["頂点", "左下", "右下"];

            // クリックした点の描画
            points.forEach((pt, idx) => {
                // 点の描画
                ctx.fillStyle = "#EF4444"; // 赤 (Tailwind Red 500)
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "white";
                ctx.lineWidth = 2;
                ctx.stroke();

                // ラベルの描画
                ctx.fillStyle = "black";
                ctx.font = "bold 16px sans-serif";
                ctx.shadowColor = "white";
                ctx.shadowBlur = 4;
                ctx.fillText(`${idx + 1}: ${labels[idx]}`, pt.x + 10, pt.y - 10);
                // シャドウのリセット
                ctx.shadowBlur = 0;
            });

            // 3点揃ったら計測線を描画
            if (points.length === 3) {
                ctx.strokeStyle = "#F59E0B"; // 黄/オレンジ (Tailwind Amber 500)
                ctx.lineWidth = 3;
                ctx.setLineDash([4, 4]); // 点線スタイル

                // 頂点から左下
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                ctx.lineTo(points[1].x, points[1].y);
                ctx.stroke();

                // 頂点から右下
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                ctx.lineTo(points[2].x, points[2].y);
                ctx.stroke();
                
                ctx.setLineDash([]); // 実線に戻す
            }
        }

        // キャンバスクリック時の処理
        canvas.onclick = function(e) {
            if (!loadedImage || points.length >= 3) return;

            // バグ修正: CSS等による表示サイズ変化に対応した正確な座標計算
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;
            
            points.push({x, y});
            
            // 状態の更新
            status.innerText = guides[points.length] || guides[3];
            redraw();

            // 3点クリック時の計算処理
            if (points.length === 3) {
                // バグ修正: 正しい配列インデックス (0, 1, 2) を指定
                const p0 = points[0]; // 頂点
                const p1 = points[1]; // 左下
                const p2 = points[2]; // 右下

                const angle1 = Math.atan2(p1.y - p0.y, p1.x - p0.x);
                const angle2 = Math.atan2(p2.y - p0.y, p2.x - p0.x);
                
                let twoAlpha = Math.abs(angle1 - angle2) * (180 / Math.PI);
                if (twoAlpha > 180) twoAlpha = 360 - twoAlpha; // 補角対応
                
                const alpha = twoAlpha / 2;

                // 結果画面をリッチに書き換え
                result.innerHTML = `
                    <div class="p-3 bg-green-50 border border-green-200 rounded-lg text-center">
                        <div class="text-xs text-green-600 font-bold uppercase tracking-wider">頂角 (2α)</div>
                        <div class="text-2xl font-black text-green-700">${twoAlpha.toFixed(2)}°</div>
                    </div>
                    <div class="p-3 bg-blue-50 border border-blue-200 rounded-lg text-center">
                        <div class="text-xs text-blue-600 font-bold uppercase tracking-wider">半頂角 (α)</div>
                        <div class="text-2xl font-black text-blue-700">${alpha.toFixed(2)}°</div>
                    </div>
                `;
                status.className = "p-3 bg-green-50 text-green-800 rounded-lg text-sm font-medium";
            }
        };

        // リセット処理
        function resetMeasurement() {
            points = [];
            status.innerText = guides[0];
            status.className = "p-3 bg-blue-50 text-blue-800 rounded-lg text-sm font-medium";
            result.innerHTML = `<div class="p-3 bg-gray-50 rounded-lg text-center text-gray-400 text-sm">データ未測定</div>`;
            redraw();
        }

        resetBtn.onclick = resetMeasurement;
    </script>
</body>
</html>
